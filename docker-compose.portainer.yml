services:
  cctv-anomaly-detection:
    image: ghcr.io/saadkhan2003/cctv-anomaly-detection:latest
    pull_policy: always
    container_name: cctv-anomaly-detection
    ports:
      - "8000:8000"
    environment:
      MODEL_SIZE: s
      DEVICE: cpu
      CONFIDENCE_THRESHOLD: "0.5"
      CROWD_THRESHOLD: "3"
      LOITER_THRESHOLD: "10"
      CCTV_DATA_DIR: /app/runtime
    volumes:
      - cctv-history:/app/runtime
      - cctv-annotated-videos:/app/static/videos/annotated
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  cctv-history:
  cctv-annotated-videos:
